version: "3.9"

networks:
  fmcg-net:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    container_name: fmcg-redis
    ports:
      - "6379:6379"
    networks:
      - fmcg-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: fmcg-api
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=fmcg-distribution-erp-super-secret-2024
      - REDIS_URL=redis://redis:6379
    networks:
      - fmcg-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: fmcg-admin
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - API_URL=http://api:4000
    networks:
      - fmcg-net
    depends_on:
      api:
        condition: service_healthy

  agent-app:
    build:
      context: ./agent-app
      dockerfile: Dockerfile
    container_name: fmcg-agent
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - API_URL=http://api:4000
      - PORT=3001
    networks:
      - fmcg-net
    depends_on:
      api:
        condition: service_healthy
